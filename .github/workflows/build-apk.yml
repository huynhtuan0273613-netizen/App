name: Build SBR Auto Typer APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git unzip openjdk-17-jdk build-essential libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython

      - name: Accept Android licenses & Build
        run: |
          # Tạo thư mục config
          mkdir -p \~/.android
          touch \~/.android/repositories.cfg

          # Chấp nhận license trước
          yes | sdkmanager --licenses || true

          # Build
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sbr-autotyper-apk
          path: bin/*.apk
          if-no-files-found: warn
